<p-card>
    <p-toast position="top-right"></p-toast>
    <div class="reports-container p-4">
        <form [formGroup]="productCategoryForm">
            <div class="card flex flex-col gap-6 w-full">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-800 mb-2">Product Category</h1>
                        <p class="text-gray-600">Add, import or bulk import new product category</p>
                    </div>
                    <div class="flex gap-2">
                        <p-button
                            label="Bulk Import"
                            icon="pi pi-plus"
                            severity="primary"
                            (onClick)="bulkInsert()" />
                        <p-button
                            label="Import Product"
                            icon="pi pi-download"
                            severity="secondary"
                            (onClick)="importProductCategory()" />
                    </div>
                </div>

                <div class="form-field">
                    <div class="form-row">
                        <label for="name" class="field-label">
                            Name <span class="required">*</span>
                            <input pInputText type="text" formControlName="name" placeholder="Name" id="name" />
                        </label>
                        @if (isFieldInvalid('name')) {
                            <small class="error-message" >
                                {{ getFieldError('name') }}
                            </small>
                        }
                    </div>
                </div>

                <div class="flex gap-2 mt-6">
                    <p-button
                        label="Save Product"
                        icon="pi pi-check"
                        severity="primary"
                        raised
                        (onClick)="saveProductCategory()"
                        [disabled]="!productCategoryForm.valid" />
                    <p-button
                        label="Cancel"
                        icon="pi pi-times"
                        severity="secondary"
                        raised
                        (onClick)="onCancel()" />
                </div>
            </div>
        </form>
    </div>
</p-card>
