<p-card class="cart-item-card">
    <ng-template pTemplate="content">
        <div class="cart-item-row">

            <!-- Product Image -->
            <div class="item-image">
                <img [src]="cartItem.product.image" [alt]="cartItem.product.title">
            </div>

            <!-- Product Title -->
            <div class="item-title">
                {{ cartItem.product.title }}
                <div class="item-category">{{ cartItem.product.category }}</div>
            </div>

            <!-- Price -->
            <div class="item-price">
                <span class="price-label">Unit Price:</span>
                {{ cartItem.product.price | currency }}
            </div>

            <!-- Quantity Selector -->
            <div class="item-quantity">
                <p-dropdown
                    [options]="qtyArr()"
                    [(ngModel)]="cartItem.quantity"
                    (onChange)="onQuantitySelected($event.value)"
                    placeholder="Qty">
                </p-dropdown>

                <span class="stock-info" *ngIf="availableStock() > 0">
          {{ availableStock() }} more available
        </span>
                <span class="stock-info warning" *ngIf="availableStock() === 0">
          No more in stock
        </span>
            </div>

            <!-- Extended Price -->
            <div class="item-extended-price">
                <span class="price-label">Total:</span>
                <span class="total-price">{{ exPrice() | currency }}</span>
            </div>

            <!-- Delete Button -->
            <div class="item-actions">
                <button pButton type="button" icon="pi pi-trash" label="Remove" class="p-button-danger"
                        (click)="removeFromCart()">
                </button>
            </div>

        </div>
    </ng-template>
</p-card>
