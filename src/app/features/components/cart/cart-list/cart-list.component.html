<div class="cart-container" *ngIf="vm$ | async as vm">

    <!-- Header -->
    <div class="cart-header">
        <h2>
            <i class="pi pi-shopping-cart"></i>
            Shopping Cart
        </h2>
        <button
            pButton
            type="button"
            label="Clear Cart"
            icon="pi pi-trash"
            class="p-button-outlined p-button-danger"
            (click)="clearCart()"
            *ngIf="vm.items.length > 0">
        </button>
    </div>

    <p-divider></p-divider>

    <!-- Cart Items -->
    <div class="cart-items" *ngIf="vm.items.length > 0">
        <app-cart-item
            *ngFor="let item of vm.items; trackBy: trackByProductId"
            [cartItem]="item">
        </app-cart-item>
    </div>

    <!-- Empty Cart -->
    <div class="empty-cart" *ngIf="vm.items.length === 0">
        <i class="pi pi-shopping-cart" style="font-size: 3rem;"></i>
        <h3>Your cart is empty</h3>
        <p>Add some products to get started!</p>
        <button pButton type="button" label="Browse Products" routerLink="/products-all" class="p-button-raised p-button-primary"></button>
    </div>

    <!-- Cart Summary -->
    <p-card class="cart-summary" *ngIf="vm.items.length > 0">
        <ng-template pTemplate="content">
            <div class="summary-row">
                <span>Total Items:</span>
                <strong>{{ vm.totalItems }}</strong>
            </div>
            <p-divider></p-divider>
            <div class="summary-row total">
                <span>Total Price:</span>
                <strong class="total-amount">{{ vm.totalPrice | currency }}</strong>
            </div>
            <button
                pButton
                type="button"
                label="Proceed to Checkout"
                icon="pi pi-credit-card"
                class="checkout-button p-button-raised p-button-primary"
                (click)="checkout()">
            </button>
        </ng-template>
    </p-card>

</div>
