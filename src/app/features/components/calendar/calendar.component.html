<p-toast></p-toast>

<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="flex flex-column md:flex-row gap-5" style="min-height: 81vh;">
                <div class="md:w-25rem card p-0">
                    <div class="flex flex-column align-items-center border-bottom-1 surface-border p-6">
                        <img ngSrc="assets/demo/images/avatar/circle/avatar-f-1@2x.png"
                             alt="User Avatar"
                             class="w-6rem h-6rem border-circle shadow-4">
                        <span class="text-900 text-xl font-semibold mt-4">My Calendars</span>
                    </div>

                    <div class="w-full flex flex-column surface-border p-4 gap-3">
                        <button pButton label="Work" icon="pi pi-briefcase" styleClass="p-button-text w-full"></button>
                        <button pButton label="Personal" icon="pi pi-user" styleClass="p-button-text w-full"></button>
                        <button pButton label="Holidays" icon="pi pi-calendar" styleClass="p-button-text w-full"></button>
                    </div>
                </div>

                <div class="flex-1 card p-4">
                    <full-calendar [options]="calendarOptions"></full-calendar>
                </div>
            </div>
        </div>
    </div>
</div>

<p-dialog
    header="Add Event"
    [(visible)]="displayDialog"
    [modal]="true"
    [style]="{ width: '25rem' }"
    [draggable]="false">

    <div class="flex flex-column gap-3">
        <label for="title">Event Title</label>
        <input id="title" pInputText [(ngModel)]="newEventTitle" placeholder="Enter event title">
    </div>

    <ng-template pTemplate="footer">
        <button pButton label="Cancel" class="p-button-text" (click)="displayDialog=false"></button>
        <button pButton label="Save" icon="pi pi-check" (click)="saveEvent()"></button>
    </ng-template>
</p-dialog>
