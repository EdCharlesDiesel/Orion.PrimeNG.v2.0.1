<p-card *ngIf="selectedProduct"
        class="w-full md:w-25rem shadow-3 border-round-lg m-auto mt-3">

    <!-- Header -->
    <ng-template pTemplate="header">
        <h4 class="m-0 text-center font-semibold text-900">
            {{ selectedProduct.title }}
        </h4>
    </ng-template>

    <!-- Product Image -->
    <img
        [src]="selectedProduct.image"
        [alt]="selectedProduct.title"
        class="w-full h-20rem object-cover border-round"
    />

    <!-- Content -->
    <ng-template pTemplate="content">
        <div class="flex flex-column align-items-center gap-2 mt-3">
            <p class="text-lg text-700 text-center">
                {{ selectedProduct.description }}
            </p>
            <p class="text-xl font-bold text-primary m-0">
                ${{ selectedProduct.price }}
            </p>
        </div>
    </ng-template>

    <!-- Footer -->
    <ng-template pTemplate="footer">
        <div class="flex justify-content-center gap-2">
            <button pButton
                    label="Buy Now"
                    icon="pi pi-shopping-cart"
                    class="p-button-success p-button-sm"
                    (click)="onBuy(selectedProduct)">
            </button>
            <button pButton
                    label="Back"
                    icon="pi pi-arrow-left"
                    class="p-button-secondary p-button-sm"
                    (click)="onBack()">
            </button>
        </div>
    </ng-template>

</p-card>
