<div class="flex justify-content-center p-4">
    <div class="w-full md:w-6 lg:w-5">
        <p-card header="Add New Product" class="shadow-3 border-round-lg">
            <form (ngSubmit)="addProduct()" #productForm="ngForm" class="flex flex-column gap-3">

                <!-- Product Title -->
                <div class="field">
                    <label for="productTitle" class="font-semibold block mb-2">Title</label>
                    <input
                        pInputText
                        id="productTitle"
                        type="text"
                        placeholder="Enter the product title"
                        [(ngModel)]="product.title"
                        name="productTitle"
                        required
                        class="w-full"
                    />
                </div>

                <!-- Product Price -->
                <div class="field">
                    <label for="productPrice" class="font-semibold block mb-2">Price</label>
                    <input
                        pInputText
                        id="productPrice"
                        type="number"
                        placeholder="Enter the product price"
                        [(ngModel)]="product.price"
                        name="productPrice"
                        required
                        class="w-full"
                    />
                </div>

                <!-- Product Description -->
                <div class="field">
                    <label for="productDescription" class="font-semibold block mb-2">Description</label>
                    <textarea
                        pInputTextarea
                        id="productDescription"
                        rows="4"
                        placeholder="Enter the product description"
                        [(ngModel)]="product.description"
                        name="productDescription"
                        required
                        class="w-full"
                        autoResize="true">
          </textarea>
                </div>

                <!-- Image URL -->
                <div class="field">
                    <label for="imageUrl" class="font-semibold block mb-2">Image URL</label>
                    <input
                        pInputText
                        id="imageUrl"
                        type="text"
                        placeholder="Paste image URL here"
                        [(ngModel)]="product.image"
                        name="imageUrl"
                        required
                        class="w-full"
                    />
                </div>

                <!-- Product Category -->
                <div class="field">
                    <label for="productCategory" class="font-semibold block mb-2">Category</label>
                    <p-dropdown
                        id="productCategory"
                        [options]="categories"
                        [(ngModel)]="product.category"
                        name="productCategory"
                        placeholder="Select a category"
                        [showClear]="true"
                        optionLabel="label"
                        optionValue="value"
                        required
                        class="w-full">
                    </p-dropdown>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-content-end pt-2">
                    <button
                        pButton
                        type="submit"
                        label="Place Order"
                        icon="pi pi-check"
                        class="p-button-primary"
                        [disabled]="productForm.invalid">
                    </button>
                </div>
            </form>
        </p-card>
    </div>
</div>

<hr class="my-4">
