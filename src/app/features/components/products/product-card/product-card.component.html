<p-card
    class="w-full md:w-25rem shadow-2 border-round-lg cursor-pointer hover:shadow-4 transition-all duration-200"
    (click)="showDetails(product.id)"
>

    <!-- Header / Category Badge -->
    <ng-template pTemplate="header">
        <span
            class="p-tag p-tag-rounded text-sm font-semibold"
            [ngClass]="getBadgeClass(product.category)">
            {{ product.category }}
        </span>
    </ng-template>

    <!-- Product Image -->
    <img
        [src]="product.image"
        [alt]="product.title"
        class="w-full border-round-top-lg h-15rem object-cover"
    />

    <!-- Card Content -->
    <ng-template pTemplate="content">
        <div class="flex flex-column gap-2 p-2">
            <h5 class="m-0 text-lg font-semibold">{{ product.title }}</h5>

            <!-- Rating Stars -->
            <div class="flex align-items-center gap-1">
                <ng-container *ngFor="let star of stars">
                    <i
                        class="pi"
                        [ngClass]="{
                            'pi-star-fill text-yellow-500': star <= rating,
                            'pi-star text-300': star > rating
                        }"
                        (click)="setRating(star); $event.stopPropagation()">
                    </i>
                </ng-container>
                <span class="text-sm text-500">({{ product.rating.count }})</span>
            </div>

            <p class="m-0 text-lg font-bold text-primary">
                ${{ product.price }}
            </p>
        </div>
    </ng-template>

    <!-- Footer / Actions -->
    <ng-template pTemplate="footer">
        <div class="flex justify-content-between align-items-center px-3 py-2 border-top-1 surface-border">
            <button
                pButton
                label="Order Now ${{ product.price }}"
                icon="pi pi-shopping-cart"
                class="p-button-success p-button-sm"
                (click)="orderProductClick($event); $event.stopPropagation()">
            </button>

            <button
                pButton
                icon="pi pi-trash"
                class="p-button-text p-button-danger p-button-sm"
                *ngIf="userService.isUserLoggedIn()"
                (click)="removeProductClick(product.id); $event.stopPropagation()">
            </button>
        </div>
    </ng-template>

</p-card>
