<p-card class="product-card" (click)="showDetails(product.id)">

    <!-- Stock Badge / Category Badge -->
    <ng-template pTemplate="header">
        <span [ngClass]="getBadgeClass(product.category)">{{ product.category }}</span>
    </ng-template>

    <!-- Product Image -->
    <img [src]="product.image" [alt]="product.title" class="product-image" />

    <!-- Card Content -->
    <ng-template pTemplate="content">
        <h5 class="product-title">{{ product.title }}</h5>

        <!-- Rating Stars -->
        <div class="rating">
      <span *ngFor="let star of stars"
            [class.filled]="star <= rating"
            (click)="setRating(star)">★
      </span>
            <span>({{ product.rating.count }})</span>
        </div>

        <p class="price">${{ product.price }}</p>
    </ng-template>

    <!-- Card Footer / Actions -->
    <ng-template pTemplate="footer">
        <div class="card-actions">
            <!-- Order Button -->
            <button pButton
                    type="button"
                    label="Order Now ${{product.price}}"
                    class="p-button-success p-button-sm"
                    (click)="orderProductClick($event)">
            </button>

            <!-- Delete Icon -->
            <i class="pi pi-trash text-danger"
               *ngIf="userService.isUserLoggedIn()"
               (click)="removeProductClick(product.id)"></i>
        </div>
    </ng-template>

</p-card>
